{% extends "layout.html" %}{% block title %}Practice · InterviewForge{% endblock %}{% block content %}<section class="panel narrow"><p class="kicker">No pressure</p><h1>Practice Arena</h1><p>Generate college final-year and campus-placement questions without changing official round progress.</p><form id="practice-page-form"><label class="field"><span>Role</span><input name="role" required placeholder="Software Developer"></label><label class="field"><span>Company</span><input name="company" required placeholder="Google"></label><label class="field"><span>Difficulty</span><select name="difficulty"><option value="easy">Easy · Core concepts</option><option value="medium" selected>Medium · Applied problem solving</option><option value="hard">Hard · Advanced placement</option></select></label><button class="btn-primary">Generate questions →</button></form><div id="practice-page-output"></div></section><script>document.getElementById('practice-page-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),out=document.getElementById('practice-page-output');out.textContent='Generating…';try{const r=await fetch('{{ url_for("assessment") }}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':'{{ session.get("csrf_token","") }}'},body:JSON.stringify({role_name:f.get('role'),company_name:f.get('company'),difficulty:f.get('difficulty'),mode:'practice'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');out.innerHTML='<p class="success">'+f.get('difficulty')+' difficulty questions</p><ol>'+d.questions.map(q=>'<li>'+q.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</li>').join('')+'</ol>'}catch(err){out.textContent=err.message}})</script>{% endblock %}
