{% extends "layout.html" %}{% block title %}Resume · InterviewForge{% endblock %}{% block content %}<section class="panel narrow"><p class="kicker">Resume analyzer</p><h1>Review your PDF resume</h1><p>InterviewForge extracts readable text from your PDF and stores it privately for future tailoring.</p><form id="resume-page-form" enctype="multipart/form-data"><label class="upload-card"><strong>Select PDF resume</strong><small>Maximum 5 MB</small><input name="resume" type="file" accept="application/pdf" required></label><button class="btn-primary">Upload and analyze →</button></form><div id="resume-page-output"></div></section><script>document.getElementById('resume-page-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('resume-page-output');out.textContent='Reading PDF…';try{const r=await fetch('{{ url_for("resume") }}',{method:'POST',headers:{'X-CSRF-Token':'{{ session.get("csrf_token","") }}'},body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');out.textContent=`Resume saved. ${d.text.length} readable characters extracted.`}catch(err){out.textContent=err.message}})</script>{% endblock %}
