{% extends "layout.html" %}{% block title %}Set up mock · InterviewForge{% endblock %}{% block content %}<section class="panel narrow"><p class="kicker">Mock setup</p><h1>Configure your interview</h1><form method="post"><label class="field"><span>Role</span><select name="role" required><option value="">Choose a role</option>{% for role in role_names %}<option>{{ role.name }}</option>{% endfor %}</select></label><label class="field"><span>Company</span><select name="company" required><option value="">Choose a company</option>{% for company in companies %}<option>{{ company.name }}</option>{% endfor %}</select></label><label class="field"><span>Interview type</span><select name="kind"><option value="hr">HR</option><option value="technical">Technical</option><option value="behavioral">Behavioral</option><option value="coding">Coding</option><option value="mixed">Mixed</option><option value="company">Company-style simulation</option></select></label><label class="field"><span>Difficulty</span><select name="difficulty"><option value="easy">Easy · Core concepts</option><option value="medium" selected>Medium · Applied problem solving</option><option value="hard">Hard · Advanced placement</option></select></label><label class="field"><span>Questions</span><select name="count"><option>5</option><option>7</option><option>10</option><option>15</option></select></label><label class="field"><span>Duration</span><select name="duration"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></label><button class="btn-primary">Start mock interview →</button></form></section>{% endblock %}
